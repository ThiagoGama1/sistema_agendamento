services:
  database:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    container_name: database
    ports:
    - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: 'admin'
      POSTGRES_DB: 'database'


volumes:
  postgres_data:
